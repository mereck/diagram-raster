name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Monospace font for ASCII renders
        run: sudo apt-get install -y fonts-dejavu-core
      - run: make check
